# Tiny Tapeout project information
project:
  title:        "8-Bit Adder"
  author:       "Your Name"
  discord:      ""
  description:  "An 8-bit digital adder that adds two 8-bit input values and produces an 8-bit output."
  language:     "Verilog"
  clock_hz:     100000

  # How many tiles your design occupies?
  tiles: "1x1"

  # Top module name
  top_module:  "tt_um_example"

  # Source files
  source_files:
    - "project.v"


# --------------------------------------------------
# Pinout
# --------------------------------------------------

pinout:

  # -----------------------------------------------
  # Dedicated inputs
  # ui_in[7:0]
  # -----------------------------------------------

  ui[0]: "ADD_INPUT_A_BIT0"
  ui[1]: "ADD_INPUT_A_BIT1"
  ui[2]: "ADD_INPUT_A_BIT2"
  ui[3]: "ADD_INPUT_A_BIT3"
  ui[4]: "ADD_INPUT_A_BIT4"
  ui[5]: "ADD_INPUT_A_BIT5"
  ui[6]: "ADD_INPUT_A_BIT6"
  ui[7]: "ADD_INPUT_A_BIT7"


  # -----------------------------------------------
  # Dedicated outputs
  # uo_out[7:0]
  # -----------------------------------------------

  uo[0]: "SUM_BIT0"
  uo[1]: "SUM_BIT1"
  uo[2]: "SUM_BIT2"
  uo[3]: "SUM_BIT3"
  uo[4]: "SUM_BIT4"
  uo[5]: "SUM_BIT5"
  uo[6]: "SUM_BIT6"
  uo[7]: "SUM_BIT7"


  # -----------------------------------------------
  # Bidirectional pins used as input B
  # -----------------------------------------------

  uio[0]: "ADD_INPUT_B_BIT0"
  uio[1]: "ADD_INPUT_B_BIT1"
  uio[2]: "ADD_INPUT_B_BIT2"
  uio[3]: "ADD_INPUT_B_BIT3"
  uio[4]: "ADD_INPUT_B_BIT4"
  uio[5]: "ADD_INPUT_B_BIT5"
  uio[6]: "ADD_INPUT_B_BIT6"
  uio[7]: "ADD_INPUT_B_BIT7"


# Do not change!
yaml_version: 6
